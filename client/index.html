<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#120b0f" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Untitled Versus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #120b0f;
        color: #fff;
        font-family: "Press Start 2P", monospace;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #menu {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: safe center;
        overflow-y: auto;
        gap: 20px;
        background: radial-gradient(circle at 50% 60%, #4a1d1d 0%, #120b0f 70%);
        z-index: 10;
        text-align: center;
        padding: 16px;
      }
      #back-btn {
        position: fixed;
        top: 6px;
        left: 6px;
        z-index: 30;
        font-size: 9px;
        padding: 6px 10px;
        box-shadow: 2px 2px 0 #1a0f14;
        opacity: 0.85;
      }
      #back-btn:active {
        transform: translate(1px, 1px);
      }
      #back-btn.hidden {
        display: none;
      }
      #room-code {
        width: 170px;
      }
      #menu.hidden {
        display: none;
      }
      h1 {
        font-size: clamp(24px, 6vw, 52px);
        text-align: center;
        margin: 0;
        color: #ffd23f;
        text-shadow: 4px 4px 0 #c4361f, 8px 8px 0 #1a0f14;
        letter-spacing: 4px;
      }
      p {
        margin: 0;
        font-size: 11px;
        color: #c9b8c0;
        line-height: 1.8;
      }
      form {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
      }
      input,
      button {
        font-family: inherit;
        font-size: 12px;
        padding: 12px 16px;
        border: 3px solid #1a0f14;
        image-rendering: pixelated;
      }
      input {
        background: #2b2026;
        color: #fff;
        width: 200px;
      }
      button {
        background: #f07a22;
        color: #1a0f14;
        cursor: pointer;
        box-shadow: 4px 4px 0 #1a0f14;
      }
      button:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 #1a0f14;
      }
      .step {
        font-size: 10px;
        color: #ffd23f;
        letter-spacing: 2px;
        margin-bottom: -8px;
      }
      #stages {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 14px;
      }
      .stage {
        width: 300px;
        padding: 10px;
        background: #241a20;
        border: 3px solid #1a0f14;
        box-shadow: 4px 4px 0 #1a0f14;
        color: #fff;
        font-family: inherit;
        text-align: left;
        cursor: pointer;
        display: grid;
        grid-template-columns: 96px 1fr;
        gap: 4px 12px;
        align-items: center;
      }
      .stage:hover {
        background: #2e2128;
      }
      .stage[aria-pressed="true"] {
        border-color: #ffd23f;
        background: #3a2418;
        outline: 3px solid #f07a22;
        outline-offset: 2px;
      }
      .stage canvas {
        grid-row: span 2;
        width: 96px;
        height: 64px;
        image-rendering: pixelated;
      }
      .stage .name {
        font-size: 11px;
        color: #ffd23f;
      }
      .stage .blurb {
        font-size: 7px;
        line-height: 1.7;
        color: #e6dbe0;
      }
      #hero-classes {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
        margin: 0 0 12px;
      }
      #hero-classes button {
        font: inherit;
        font-size: 10px;
        padding: 6px 10px;
        cursor: pointer;
        color: var(--c);
        background: #241a20;
        border: 2px solid var(--c);
        box-shadow: 2px 2px 0 #1a0f14;
      }
      #hero-classes button[aria-pressed="true"] {
        background: var(--c);
        color: #1a0f14;
      }
      .hero[hidden] {
        display: none;
      }
      .hero .cls {
        color: #1a0f14;
        background: var(--c);
        padding: 1px 4px;
        font-weight: normal;
      }
      #heroes {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 14px;
        max-width: 980px;
      }
      .hero {
        width: 240px;
        padding: 14px;
        background: #241a20;
        border: 3px solid #1a0f14;
        box-shadow: 4px 4px 0 #1a0f14;
        color: #fff;
        font-family: inherit;
        text-align: left;
        cursor: pointer;
        display: grid;
        grid-template-columns: 72px 1fr;
        gap: 4px 12px;
        align-items: start;
      }
      .hero:hover {
        background: #2e2128;
      }
      .hero[aria-pressed="true"] {
        border-color: #ffd23f;
        background: #3a2418;
        outline: 3px solid #f07a22;
        outline-offset: 2px;
      }
      .hero canvas {
        grid-row: span 4;
        width: 64px;
        height: 72px;
        image-rendering: pixelated;
      }
      .hero .name {
        font-size: 11px;
        color: #ffd23f;
        line-height: 1.5;
      }
      .hero .stars {
        color: #ffd23f;
        font-size: 12px;
        letter-spacing: 1px;
      }
      .hero .stars.special {
        background: linear-gradient(90deg, #ff2a6a, #ffd23f, #2affea, #c93bd8);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        font-size: 10px;
      }
      /* Yaotsu's card glitches like a rendering error */
      .hero.special canvas {
        animation: glitch 1.6s steps(1) infinite;
      }
      @keyframes glitch {
        0%, 86%, 100% { transform: none; filter: none; }
        88% { transform: translate(-2px, 1px) skewX(8deg); filter: drop-shadow(2px 0 #ff2a6a) drop-shadow(-2px 0 #2affea); }
        91% { transform: translate(2px, -1px); filter: drop-shadow(-3px 0 #ff2a6a) drop-shadow(3px 0 #2affea) invert(1); }
        94% { transform: translate(-1px, 0) skewX(-6deg); filter: drop-shadow(2px 0 #2affea); }
      }
      @media (prefers-reduced-motion: reduce) {
        .hero.special canvas { animation: none; }
      }
      .hero .stars .dim {
        color: #4a3f45;
      }
      .hero .role {
        font-size: 8px;
        color: #c9b8c0;
      }
      .hero .stats {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 5px 8px;
        font-size: 7px;
        color: #c9b8c0;
        align-items: center;
        margin-top: 6px;
      }
      .hero .bar {
        height: 6px;
        background: #120b0f;
      }
      .hero .bar span {
        display: block;
        height: 100%;
        background: #f07a22;
      }
      .hero .blurb {
        grid-column: 1 / -1;
        font-size: 7px;
        line-height: 1.7;
        color: #e6dbe0;
        margin-top: 4px;
      }
      @media (max-height: 500px) {
        #menu {
          gap: 10px;
          padding-block: 10px;
        }
        h1 {
          font-size: 24px;
        }
        #intro {
          display: none;
        }
        .hero {
          width: 180px;
          padding: 8px;
          grid-template-columns: 44px 1fr;
        }
        .hero canvas {
          width: 40px;
          height: 45px;
        }
        .hero .blurb {
          display: none;
        }
        .stage {
          width: 260px;
          padding: 6px;
          grid-template-columns: 60px 1fr;
        }
        .stage canvas {
          width: 60px;
          height: 40px;
        }
      }
      #rotate {
        display: none;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          position: fixed;
          inset: 0;
          z-index: 20;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          background: #120b0f;
          font-size: 12px;
          line-height: 1.8;
          text-align: center;
          padding: 16px;
        }
        #rotate .icon {
          font-size: 48px;
          animation: turn 1.6s ease-in-out infinite;
        }
      }
      @keyframes turn {
        50% {
          transform: rotate(90deg);
        }
      }
      #open-world {
        display: block;
        margin: 4px auto 12px;
        padding: 12px 28px;
        font-size: 14px;
        background: #2fae6a;
        color: #fff;
        border: 3px solid #1d7a48;
        border-radius: 6px;
        box-shadow: 0 4px 0 #145a34;
        letter-spacing: 1px;
      }
      #open-world:hover { background: #38c47a; }
      #cover {
        display: block;
        margin: 0 auto -4px;
        width: 110px;
        height: 110px;
        image-rendering: auto;
      }
      #error {
        color: #ff6a5a;
        min-height: 1em;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="menu">
      <img id="cover" alt="" width="110" height="110" />
      <h1>UNTITLED VERSUS</h1>
      <button type="button" id="open-world">OPEN WORLD</button>
      <p id="intro">The multiverse is collapsing. Pick a stage and a hero.</p>
      <p class="step">CHOOSE A STAGE</p>
      <div id="stages" role="group" aria-label="Choose a stage"></div>
      <p class="step">CHOOSE A HERO</p>
      <div id="heroes" role="group" aria-label="Choose your hero"></div>
      <form id="join-form">
        <input id="name" maxlength="16" placeholder="Your name" autocomplete="off" />
        <input id="room-code" maxlength="8" placeholder="Room no. (online)" autocomplete="off" inputmode="numeric" />
        <button type="submit" id="join-online">PLAY ONLINE</button>
        <button type="submit" id="join-solo">PLAY SOLO</button>
      </form>
      <p id="error"></p>
    </div>
    <button type="button" id="back-btn" class="hidden" aria-label="Back to menu">&#9664; BACK</button>
    <div id="rotate">
      <div class="icon">📱</div>
      <p>Turn your phone sideways to play</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
