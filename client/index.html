<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#120b0f" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <title>Riftborn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #120b0f;
        color: #fff;
        font-family: "Press Start 2P", monospace;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #menu {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: radial-gradient(circle at 50% 60%, #4a1d1d 0%, #120b0f 70%);
        z-index: 10;
        text-align: center;
        padding: 16px;
      }
      #menu.hidden {
        display: none;
      }
      h1 {
        font-size: clamp(28px, 7vw, 56px);
        margin: 0;
        color: #ffd23f;
        text-shadow: 4px 4px 0 #c4361f, 8px 8px 0 #1a0f14;
        letter-spacing: 4px;
      }
      p {
        margin: 0;
        font-size: 11px;
        color: #c9b8c0;
        line-height: 1.8;
      }
      form {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
      }
      input,
      button {
        font-family: inherit;
        font-size: 12px;
        padding: 12px 16px;
        border: 3px solid #1a0f14;
        image-rendering: pixelated;
      }
      input {
        background: #2b2026;
        color: #fff;
        width: 200px;
      }
      button {
        background: #f07a22;
        color: #1a0f14;
        cursor: pointer;
        box-shadow: 4px 4px 0 #1a0f14;
      }
      button:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 #1a0f14;
      }
      #rotate {
        display: none;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          position: fixed;
          inset: 0;
          z-index: 20;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          background: #120b0f;
          font-size: 12px;
          line-height: 1.8;
          text-align: center;
          padding: 16px;
        }
        #rotate .icon {
          font-size: 48px;
          animation: turn 1.6s ease-in-out infinite;
        }
      }
      @keyframes turn {
        50% {
          transform: rotate(90deg);
        }
      }
      #error {
        color: #ff6a5a;
        min-height: 1em;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="menu">
      <h1>RIFTBORN</h1>
      <p>The multiverse is collapsing. Hold the rift in Emberfall.<br />Survive 4 waves and slay the Pyre Warden. Mind the lava.</p>
      <form id="join-form">
        <input id="name" maxlength="16" placeholder="Your name" autocomplete="off" />
        <button type="submit">ENTER THE RIFT</button>
      </form>
      <p id="error"></p>
    </div>
    <div id="rotate">
      <div class="icon">📱</div>
      <p>Turn your phone sideways to play</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
